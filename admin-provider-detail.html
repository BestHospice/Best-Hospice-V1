<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Provider Detail | Best Hospice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .shell { max-width: 760px; margin: 24px auto; padding: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #e5e7eb; box-shadow: 0 12px 24px rgba(15,23,42,0.08); display: grid; gap: 10px; }
    .note { color: #4b5563; font-size: 14px; }
    .login-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; box-shadow: 0 12px 24px rgba(15,23,42,0.08); display: grid; gap: 10px; max-width: 420px; margin: 0 auto 16px; }
    .login-card input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; }
    .hidden { display: none; }
    .meta { display: grid; gap: 6px; color: #4b5563; }
    .form-grid { display:grid; gap:10px; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); }
    .form-grid label { display:block; font-weight:700; font-size:14px; margin-bottom:4px; }
    .form-grid input { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; }
    .form-grid select { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:8px; background:#fff; }
  </style>
</head>
<body>
  <div class="shell">
    <div id="login-card" class="login-card">
      <h2>Provider Detail</h2>
      <p class="note">Enter the Provider Dashboard Token to view and update details.</p>
      <input id="token" type="password" placeholder="Type token here" />
      <button class="button" id="login-btn">Unlock</button>
      <p id="login-status" class="note"></p>
    </div>

    <div id="detail-card" class="card hidden">
      <h1 id="prov-name"></h1>
      <div class="meta">
        <span><strong>Email:</strong> <span id="prov-email"></span></span>
        <span><strong>Phone:</strong> <span id="prov-phone"></span></span>
        <span><strong>Website:</strong> <span id="prov-website"></span></span>
        <span><strong>Address:</strong> <span id="prov-address"></span></span>
        <span><strong>Latitude:</strong> <span id="prov-lat"></span> | <strong>Longitude:</strong> <span id="prov-lon"></span></span>
        <span><strong>Service Radius:</strong> <span id="prov-radius"></span></span>
        <span><strong>Plan Tier:</strong> <span id="prov-plan-tier"></span></span>
        <span><strong>Leads Best Hospice has provided:</strong> <span id="prov-leads"></span></span>
        <span><strong>Added:</strong> <span id="prov-added"></span></span>
      </div>
      <div style="border-top:1px solid #e5e7eb; padding-top:10px;">
        <h3>Edit Provider</h3>
        <div class="form-grid">
          <div><label for="f-name">Name</label><input id="f-name" type="text"></div>
          <div><label for="f-email">Email</label><input id="f-email" type="email"></div>
          <div><label for="f-phone">Phone</label><input id="f-phone" type="text"></div>
          <div><label for="f-website">Website</label><input id="f-website" type="text"></div>
          <div><label for="f-address">Address</label><input id="f-address" type="text"></div>
          <div><label for="f-city">City</label><input id="f-city" type="text"></div>
          <div><label for="f-state">State</label><input id="f-state" type="text"></div>
          <div><label for="f-zip">Zip</label><input id="f-zip" type="text"></div>
          <div><label for="f-lat">Latitude</label><input id="f-lat" type="text"></div>
          <div><label for="f-lon">Longitude</label><input id="f-lon" type="text"></div>
          <div><label for="f-radius">Service radius (miles)</label><input id="f-radius" type="number" step="0.1" min="0"></div>
          <div>
            <label for="f-plan-tier">Plan tier</label>
            <select id="f-plan-tier">
              <option value="starter">Starter — $250/mo</option>
              <option value="growth">Growth — $300/mo</option>
              <option value="growth_plus">Growth+ — $350/mo ⭐ Verified</option>
              <option value="advanced">Advanced — $400/mo ⭐⭐ Verified + Featured</option>
              <option value="market_leader">Market Leader — $500/mo ⭐⭐⭐ Priority Placement</option>
            </select>
          </div>
        </div>
        <button class="button" id="save-btn" style="margin-top:10px;">Save changes</button>
        <p id="save-status" class="note"></p>
      </div>
      <a class="button" href="admin-dashboard.html">Back to Dashboard</a>
    </div>
  </div>
  <script>
    let dashToken = '';
    let providerId = '';
    const params = new URLSearchParams(window.location.search);
    providerId = params.get('id') || '';
    const loginStatus = document.getElementById('login-status');
    const loginCard = document.getElementById('login-card');
    const detailCard = document.getElementById('detail-card');
    const saveStatus = document.getElementById('save-status');
    let currentProvider = null;

    async function fetchProviders(token) {
      const res = await fetch('/api/providers/secure', { headers: { 'x-admin-token': token } });
      if (!res.ok) throw new Error('Invalid token');
      return res.json();
    }

    function renderProvider(p) {
      currentProvider = p;
      document.getElementById('prov-name').textContent = p.name || 'Unnamed';
      document.getElementById('prov-email').textContent = p.email || '—';
      document.getElementById('prov-phone').textContent = p.phone || '—';
      document.getElementById('prov-website').innerHTML = p.website ? `<a href="${p.website}" target="_blank" rel="noopener">${p.website}</a>` : '—';
      document.getElementById('prov-address').textContent = p.address || '—';
      document.getElementById('prov-lat').textContent = p.lat ?? '—';
      document.getElementById('prov-lon').textContent = p.lon ?? '—';
      document.getElementById('prov-radius').textContent = p.serviceRadiusKm ? `${(p.serviceRadiusKm / 1.60934).toFixed(1)} mi` : '—';
      document.getElementById('prov-plan-tier').textContent = p.planTier || 'starter';
      document.getElementById('prov-leads').textContent = p.leadCount ?? 0;
      document.getElementById('prov-added').textContent = p.createdAt ? new Date(p.createdAt).toLocaleDateString() : '—';

      // Prefill form
      document.getElementById('f-name').value = p.name || '';
      document.getElementById('f-email').value = p.email || '';
      document.getElementById('f-phone').value = p.phone || '';
      document.getElementById('f-website').value = p.website || '';
      document.getElementById('f-address').value = p.address || '';
      document.getElementById('f-city').value = p.city || '';
      document.getElementById('f-state').value = p.state || '';
      document.getElementById('f-zip').value = p.zip || '';
      document.getElementById('f-lat').value = p.lat ?? '';
      document.getElementById('f-lon').value = p.lon ?? '';
      document.getElementById('f-radius').value = p.serviceRadiusKm ? (p.serviceRadiusKm / 1.60934).toFixed(1) : '';
      document.getElementById('f-plan-tier').value = p.planTier || 'starter';
    }

    async function unlock() {
      const token = document.getElementById('token').value.trim();
      if (!token) {
        loginStatus.textContent = 'Enter your Provider Dashboard Token.';
        return;
      }
      loginStatus.textContent = 'Verifying...';
      try {
        const providers = await fetchProviders(token);
        dashToken = token;
        const found = (providers || []).find((p) => p.id === providerId);
        if (!found) {
          loginStatus.textContent = 'Provider not found.';
          return;
        }
        loginCard.classList.add('hidden');
        detailCard.classList.remove('hidden');
        renderProvider(found);
      } catch (err) {
        loginStatus.textContent = 'Invalid token or provider.';
      }
    }

    document.getElementById('login-btn').addEventListener('click', unlock);

    async function saveChanges() {
      if (!dashToken || !currentProvider) return;
      saveStatus.textContent = 'Saving...';
      const body = {
        name: document.getElementById('f-name').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        phone: document.getElementById('f-phone').value.trim(),
        website: document.getElementById('f-website').value.trim(),
        address: document.getElementById('f-address').value.trim(),
        city: document.getElementById('f-city').value.trim(),
        state: document.getElementById('f-state').value.trim(),
        zip: document.getElementById('f-zip').value.trim(),
        lat: document.getElementById('f-lat').value.trim(),
        lon: document.getElementById('f-lon').value.trim(),
        serviceRadiusMiles: document.getElementById('f-radius').value.trim(),
        planTier: document.getElementById('f-plan-tier').value
      };
      try {
        const res = await fetch(`/api/providers/${encodeURIComponent(currentProvider.id)}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-token': dashToken
          },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) {
          saveStatus.textContent = data.error || 'Failed to save.';
          return;
        }
        saveStatus.textContent = 'Saved.';
        renderProvider(data.provider);
      } catch (err) {
        saveStatus.textContent = 'Error saving changes.';
      }
    }

    document.getElementById('save-btn').addEventListener('click', saveChanges);
  </script>
</body>
</html>
