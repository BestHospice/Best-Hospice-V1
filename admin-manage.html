<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Providers | Best Hospice and Home Health</title>
  <meta name="description" content="Internal admin management page for searching and removing provider listings." />
  <link rel="canonical" href="https://www.besthospice.com/admin-manage.html" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-modern.css" />
    <link rel="stylesheet" href="/styles/main.css" />
  <style>
    .admin-shell { max-width: 720px; margin: 24px auto; padding: 16px; }
    .admin-card { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #e5e7eb; box-shadow: 0 12px 24px rgba(15,23,42,0.08); display: grid; gap: 10px; }
    .note { color: #4b5563; font-size: 14px; }
    .login-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; box-shadow: 0 12px 24px rgba(15,23,42,0.08); display: grid; gap: 10px; max-width: 420px; margin: 0 auto 16px; }
    .login-card input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; }
    .hidden { display: none; }
    .list { margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px solid #e5e7eb; background: #f8fafc; }
    .search-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .search-row input { flex: 1 1 220px; padding: 10px; border-radius: 10px; border: 1px solid #d1d5db; }
    .provider-item { padding: 6px 0; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .provider-item:last-child { border-bottom: none; }
    .muted { color: #6b7280; font-size: 13px; }
  </style><script src="/abel-chat.js" defer></script>
  <script src="/admin-auth.js" defer></script>
</head>
<body>
  <div class="admin-shell">
    <div id="admin-card" class="admin-card hidden">
      <div class="list">
        <h3>All Providers (alphabetical)</h3>
        <div class="search-row">
          <input id="search" type="text" placeholder="Search providers by name, email, or address..." />
          <button class="button button-small" id="clear-search" type="button">Clear</button>
        </div>
        <div id="list"></div>
      </div>
      <p id="status" class="note"></p>
      <a class="ghost" href="admin.html">Back to Admin options</a>
    </div>
  </div>
  <script>
    let allProviders = [];
    let filteredProviders = [];
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    const adminCard = document.getElementById('admin-card');
    const searchInput = document.getElementById('search');
    const clearSearch = document.getElementById('clear-search');

    async function loadProviders() {
      try {
        const res = await fetch('/api/providers', { credentials: 'same-origin' });
        const data = await res.json();
        allProviders = Array.isArray(data) ? data : [];
        applyFilter();
      } catch (err) {
        statusEl.textContent = 'Failed to load providers.';
      }
    }

    function applyFilter() {
      const term = (searchInput.value || '').toLowerCase().trim();
      if (!term) {
        filteredProviders = [...allProviders];
      } else {
        filteredProviders = allProviders.filter((p) => {
          const bucket = `${p.name || ''} ${p.email || ''} ${p.address || ''}`.toLowerCase();
          return bucket.includes(term);
        });
      }
      renderProvidersList();
    }

    function renderProvidersList() {
      listEl.innerHTML = '';
      if (!allProviders.length) {
        const none = document.createElement('p');
        none.className = 'muted';
        none.textContent = 'No providers added yet.';
        listEl.appendChild(none);
        return;
      }
      if (!filteredProviders.length) {
        const none = document.createElement('p');
        none.className = 'muted';
        none.textContent = 'No providers match that search.';
        listEl.appendChild(none);
        return;
      }
      const sorted = [...filteredProviders].sort((a, b) => a.name.localeCompare(b.name));
      sorted.forEach((p) => {
        const div = document.createElement('div');
        div.className = 'provider-item';
        const nameSpan = document.createElement('span');
        nameSpan.textContent = `${p.name} — ${p.address || 'No address'} (${p.email || 'No email'})`;
        const removeBtn = document.createElement('button');
        removeBtn.textContent = 'Remove';
        removeBtn.className = 'button button-small';
        removeBtn.addEventListener('click', () => removeProvider(p.id));
        div.appendChild(nameSpan);
        div.appendChild(removeBtn);
        listEl.appendChild(div);
      });
    }

    async function removeProvider(id) {
      if (!confirm('Remove this provider?')) return;
      statusEl.textContent = 'Removing...';
      try {
        const res = await fetch(`/api/providers/${encodeURIComponent(id)}`, {
          method: 'DELETE',
          credentials: 'same-origin'
        });
        const data = await res.json();
        if (!res.ok) {
          statusEl.textContent = data.error || 'Failed to remove provider.';
          return;
        }
        statusEl.textContent = 'Removed.';
        await loadProviders();
      } catch (err) {
        statusEl.textContent = 'Error removing provider.';
      }
    }

    searchInput.addEventListener('input', applyFilter);
    clearSearch.addEventListener('click', () => {
      searchInput.value = '';
      applyFilter();
    });
    adminCard.classList.remove('hidden');
    statusEl.textContent = 'Ready.';
    loadProviders();
  </script>
</body>
</html>
