<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter Subscribers | Best Hospice Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-modern.css" />
  <link rel="stylesheet" href="/styles/main.css" />
  <style>
    .admin-shell { max-width: 960px; margin: 24px auto; padding: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; border: 1px solid #e5e7eb; box-shadow: 0 12px 24px rgba(15,23,42,0.08); display: grid; gap: 10px; }
    .note { color: #4b5563; font-size: 14px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #e5e7eb; color: #374151; font-weight: 600; }
    td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .btn-delete { background: none; border: 1px solid #fca5a5; color: #dc2626; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
    .btn-delete:hover { background: #fef2f2; }
    .hidden { display: none; }
  </style>
  <script src="/abel-chat.js" defer></script>
  <script src="/admin-auth.js" defer></script>
</head>
<body>
  <div class="admin-shell">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
      <div>
        <h1 style="margin:0;">Newsletter Subscribers</h1>
        <p class="note" id="sub-count">Loading…</p>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="button" id="send-now-btn" type="button">Generate &amp; Send Now</button>
        <a class="button ghost" href="admin-menu.html">Back to Admin</a>
        <button class="button ghost" id="admin-logout-btn" type="button">Log Out</button>
      </div>
    </div>

    <div class="card" id="pipeline-result" style="display:none; margin-bottom:16px; border-left:4px solid #0f766e;">
      <p id="pipeline-msg" class="note" style="margin:0;"></p>
    </div>

    <div class="card">
      <p id="status" class="note"></p>
      <div style="overflow-x:auto;">
        <table id="subscriber-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Date Subscribed</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="subscriber-body">
          </tbody>
        </table>
      </div>
      <p id="empty-msg" class="note hidden">No subscribers yet.</p>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const subCount = document.getElementById('sub-count');
    const tbody = document.getElementById('subscriber-body');
    const emptyMsg = document.getElementById('empty-msg');
    const table = document.getElementById('subscriber-table');

    function formatDate(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function renderRow(sub) {
      const tr = document.createElement('tr');
      tr.dataset.id = sub.id;
      tr.innerHTML = `
        <td>${sub.name || '—'}</td>
        <td>${sub.email || '—'}</td>
        <td>${formatDate(sub.created_at)}</td>
        <td><button class="btn-delete" data-id="${sub.id}">Delete</button></td>
      `;
      tr.querySelector('.btn-delete').addEventListener('click', () => deleteSubscriber(sub.id, tr));
      return tr;
    }

    async function deleteSubscriber(id, tr) {
      if (!confirm('Remove this subscriber?')) return;
      try {
        const res = await fetch(`/api/admin/newsletter/subscribers/${encodeURIComponent(id)}`, {
          method: 'DELETE',
          credentials: 'same-origin'
        });
        const data = await res.json();
        if (data.ok) {
          tr.remove();
          const remaining = tbody.querySelectorAll('tr').length;
          subCount.textContent = `${remaining} subscriber${remaining !== 1 ? 's' : ''}`;
          if (remaining === 0) {
            table.classList.add('hidden');
            emptyMsg.classList.remove('hidden');
          }
        } else {
          alert(data.error || 'Could not delete subscriber.');
        }
      } catch (err) {
        alert('Could not delete subscriber.');
      }
    }

    fetch('/api/admin/newsletter/subscribers', { credentials: 'same-origin' })
      .then(async (res) => {
        if (!res.ok) throw new Error('Failed to load subscribers');
        return res.json();
      })
      .then((data) => {
        const subs = data.subscribers || [];
        subCount.textContent = `${subs.length} subscriber${subs.length !== 1 ? 's' : ''}`;
        statusEl.textContent = '';
        if (!subs.length) {
          table.classList.add('hidden');
          emptyMsg.classList.remove('hidden');
          return;
        }
        subs.forEach((sub) => tbody.appendChild(renderRow(sub)));
      })
      .catch((err) => {
        statusEl.textContent = err?.message || 'Could not load subscribers.';
        subCount.textContent = '';
      });

    document.getElementById('admin-logout-btn').addEventListener('click', async () => {
      await window.adminAuth.logout();
      window.location.href = 'admin.html';
    });

    const sendNowBtn = document.getElementById('send-now-btn');
    const pipelineResult = document.getElementById('pipeline-result');
    const pipelineMsg = document.getElementById('pipeline-msg');

    sendNowBtn.addEventListener('click', async () => {
      if (!confirm('Generate and send a newsletter issue to all subscribers now?')) return;
      sendNowBtn.disabled = true;
      sendNowBtn.textContent = 'Running pipeline…';
      pipelineResult.style.display = 'none';
      try {
        const res = await fetch('/api/admin/newsletter/send-now', {
          method: 'POST',
          credentials: 'same-origin'
        });
        const data = await res.json();
        pipelineResult.style.display = 'block';
        if (data.ok) {
          pipelineResult.style.borderColor = '#0f766e';
          pipelineMsg.style.color = '#0f766e';
          pipelineMsg.textContent = `Issue #${data.issueNumber} sent. Subject: "${data.subject}" · ${data.sent ?? 0} emails sent to ${data.subscriberCount ?? 0} subscribers. Archive: /newsletter/${data.slug}`;
        } else {
          pipelineResult.style.borderColor = '#dc2626';
          pipelineMsg.style.color = '#dc2626';
          pipelineMsg.textContent = data.error || 'Pipeline failed.';
        }
      } catch (err) {
        pipelineResult.style.display = 'block';
        pipelineResult.style.borderColor = '#dc2626';
        pipelineMsg.style.color = '#dc2626';
        pipelineMsg.textContent = 'Could not reach server. Check logs.';
      }
      sendNowBtn.disabled = false;
      sendNowBtn.textContent = 'Generate & Send Now';
    });
  </script>
</body>
</html>
