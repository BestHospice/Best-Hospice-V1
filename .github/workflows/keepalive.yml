name: Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping BestHospice.com
        run: |
          STATUS=$(curl -o /dev/null -s -w "%{http_code}" https://www.besthospice.com/healthz)
          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "WARNING: healthz returned $STATUS"
            exit 1
          fi
