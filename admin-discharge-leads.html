<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discharge Planner Leads | Best Hospice Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-modern.css">
  <link rel="stylesheet" href="/styles/main.css">
  <style>
    .admin-shell { max-width: 1100px; margin: 24px auto; padding: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid #e5e7eb; box-shadow: 0 12px 24px rgba(15,23,42,0.08); margin-bottom: 20px; }
    .note { color: #4b5563; font-size: 14px; }
    .stat-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat-box { background: #fff; border-radius: 10px; padding: 16px 20px; border: 1px solid #e5e7eb; box-shadow: 0 4px 12px rgba(15,23,42,0.06); min-width: 140px; }
    .stat-box .val { font-size: 2rem; font-weight: 700; color: #0f766e; line-height: 1; }
    .stat-box .lbl { font-size: 13px; color: #6b7280; margin-top: 4px; }
    .filters-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .filters-row select, .filters-row input[type="text"] { padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-family: inherit; font-size: 13px; background: #fff; }
    .filters-row input[type="text"] { width: 220px; }
    .result-count { font-size: 13px; color: #6b7280; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #e5e7eb; color: #374151; font-weight: 600; cursor: pointer; user-select: none; white-space: nowrap; }
    th:hover { color: #0f766e; }
    td { padding: 8px 10px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: #f8fafc; cursor: pointer; }
    .table-wrap { overflow-x: auto; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 100px; font-size: 12px; font-weight: 600; }
    .badge-new { background: #eff6ff; color: #2563eb; }
    .badge-contacted { background: #fffbeb; color: #d97706; }
    .badge-matched { background: #f0fdf4; color: #15803d; }
    .badge-closed { background: #f1f5f9; color: #64748b; }
    .urgency { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
    .urgency-immediate { background: #fef2f2; color: #dc2626; }
    .urgency-withinweek { background: #fffbeb; color: #d97706; }
    .urgency-planningahead { background: #f1f5f9; color: #64748b; }
    .detail-panel { display: none; }
    .detail-panel.open { display: table-row; }
    .detail-inner { padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; background: #f8fafc; border-top: 1px solid #e5e7eb; }
    .detail-group label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6b7280; display: block; margin-bottom: 3px; }
    .detail-group p { font-size: 13px; color: #1e293b; }
    .detail-actions { display: flex; flex-direction: column; gap: 8px; }
    .status-select { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 8px; font-family: inherit; font-size: 13px; background: #fff; width: 150px; }
    .pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 10px; border-top: 1px solid #e5e7eb; font-size: 13px; color: #6b7280; }
    .page-btns { display: flex; gap: 4px; }
    .page-btn { padding: 3px 9px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-size: 13px; font-family: inherit; }
    .page-btn:hover { border-color: #0f766e; color: #0f766e; }
    .page-btn.active { background: #0f766e; color: #fff; border-color: #0f766e; }
    .empty-state { padding: 40px; text-align: center; color: #6b7280; }
    .btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; cursor: pointer; font-family: inherit; font-weight: 600; }
    .btn-sm:hover { border-color: #0f766e; color: #0f766e; }
    .btn-del { background: #fef2f2; color: #dc2626; border-color: #fecaca; }
    .btn-del:hover { background: #fee2e2; border-color: #dc2626; }
  </style>
  <script src="/abel-chat.js" defer></script>
  <script src="/admin-auth.js" defer></script>
</head>
<body>
  <div class="admin-shell">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
      <div>
        <h1 style="margin:0;">Discharge Planner Referrals</h1>
        <p class="note">Patient referrals submitted by hospital discharge planners via /discharge-planners.</p>
      </div>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="button ghost" onclick="exportCSV()">Export CSV</button>
        <button class="button ghost" onclick="loadLeads()">Refresh</button>
        <a class="button ghost" href="admin-menu.html">Back to Admin</a>
        <button class="button ghost" id="admin-logout-btn" type="button">Log Out</button>
      </div>
    </div>

    <div class="stat-row" id="stat-row" style="display:none;">
      <div class="stat-box">
        <div class="val" id="statTotal">—</div>
        <div class="lbl">Total Referrals</div>
      </div>
      <div class="stat-box">
        <div class="val" id="statNew">—</div>
        <div class="lbl">New (Uncontacted)</div>
      </div>
      <div class="stat-box">
        <div class="val" id="statMatched">—</div>
        <div class="lbl">Matched to Provider</div>
      </div>
      <div class="stat-box">
        <div class="val" id="statPlanners">—</div>
        <div class="lbl">Unique Planners</div>
      </div>
    </div>

    <div class="card">
      <div class="filters-row">
        <input type="text" id="searchInput" placeholder="Search patient, planner, facility..." oninput="renderTable()">
        <select id="filterStatus" onchange="renderTable()">
          <option value="">All Statuses</option>
          <option value="new">New</option>
          <option value="contacted">Contacted</option>
          <option value="matched">Matched</option>
          <option value="closed">Closed</option>
        </select>
        <select id="filterCare" onchange="renderTable()">
          <option value="">All Care Types</option>
          <option value="hospice">Hospice</option>
          <option value="home_health">Home Health</option>
          <option value="palliative">Palliative</option>
        </select>
        <select id="filterUrgency" onchange="renderTable()">
          <option value="">All Urgency</option>
          <option value="immediate">Immediate</option>
          <option value="within_week">Within Week</option>
          <option value="planning_ahead">Planning Ahead</option>
        </select>
        <span class="result-count" id="resultCount"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('submitted_at')">Date</th>
              <th onclick="sortBy('patient_last')">Patient</th>
              <th onclick="sortBy('planner_name')">Planner</th>
              <th onclick="sortBy('facility')">Facility</th>
              <th onclick="sortBy('patient_zip')">ZIP</th>
              <th onclick="sortBy('care_type')">Care Type</th>
              <th onclick="sortBy('urgency')">Urgency</th>
              <th onclick="sortBy('status')">Status</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none;">
          <p>No referrals match your filters.</p>
        </div>
        <div class="pagination">
          <span id="pageInfo"></span>
          <div class="page-btns" id="pageBtns"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SAMPLE_LEADS = [];

    let leads = [...SAMPLE_LEADS];
    let sortCol = 'submitted_at';
    let sortDir = 'desc';
    let currentPage = 1;
    const PER_PAGE = 10;

    async function loadLeads() {
      try {
        const res = await fetch('/api/admin/discharge-referrals');
        if (res.ok) {
          leads = await res.json();
        }
      } catch(e) {
        leads = [...SAMPLE_LEADS];
      }
      renderStats();
      renderTable();
    }

    function renderStats() {
      document.getElementById('statTotal').textContent = leads.length;
      document.getElementById('statNew').textContent = leads.filter(l => l.status === 'new').length;
      document.getElementById('statMatched').textContent = leads.filter(l => l.status === 'matched').length;
      const planners = new Set(leads.map(l => l.planner_email));
      document.getElementById('statPlanners').textContent = planners.size;
      document.getElementById('stat-row').style.display = leads.length ? 'flex' : 'none';
    }

    function sortBy(col) {
      if (sortCol === col) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortCol = col; sortDir = 'asc'; }
      currentPage = 1;
      renderTable();
    }

    function getFiltered() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const status = document.getElementById('filterStatus').value;
      const care = document.getElementById('filterCare').value;
      const urgency = document.getElementById('filterUrgency').value;
      return leads.filter(l => {
        const matchSearch = !search ||
          ((l.patient_first || '') + ' ' + (l.patient_last || '')).toLowerCase().includes(search) ||
          (l.planner_name || '').toLowerCase().includes(search) ||
          (l.facility || '').toLowerCase().includes(search) ||
          (l.patient_zip || '').includes(search);
        const matchStatus = !status || l.status === status;
        const matchCare = !care || l.care_type === care;
        const matchUrgency = !urgency || l.urgency === urgency;
        return matchSearch && matchStatus && matchCare && matchUrgency;
      }).sort((a, b) => {
        let va = a[sortCol] || ''; let vb = b[sortCol] || '';
        if (sortCol === 'submitted_at') { va = new Date(va); vb = new Date(vb); }
        if (va < vb) return sortDir === 'asc' ? -1 : 1;
        if (va > vb) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
    }

    function renderTable() {
      const filtered = getFiltered();
      const total = filtered.length;
      const pages = Math.ceil(total / PER_PAGE) || 1;
      if (currentPage > pages) currentPage = 1;
      const start = (currentPage - 1) * PER_PAGE;
      const pageLeads = filtered.slice(start, start + PER_PAGE);

      document.getElementById('resultCount').textContent = `${total} referral${total !== 1 ? 's' : ''}`;
      document.getElementById('emptyState').style.display = total === 0 ? 'block' : 'none';

      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      pageLeads.forEach(lead => {
        const date = lead.submitted_at ? new Date(lead.submitted_at) : null;
        const dateStr = date ? date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';

        const tr = document.createElement('tr');
        tr.dataset.id = lead.id;
        tr.innerHTML = `
          <td style="white-space:nowrap;">${dateStr}</td>
          <td><strong>${lead.patient_last || ''}, ${lead.patient_first || ''}</strong></td>
          <td>
            <div>${lead.planner_name || '—'}</div>
            <div style="font-size:12px;color:#6b7280;">${lead.planner_title || ''}</div>
          </td>
          <td style="font-size:13px;">${lead.facility || '—'}</td>
          <td><strong>${lead.patient_zip || '—'}</strong></td>
          <td>${formatCareType(lead.care_type)}</td>
          <td><span class="urgency urgency-${(lead.urgency || '').replace(/_/g,'')}">${formatUrgency(lead.urgency)}</span></td>
          <td><span class="badge badge-${lead.status || 'new'}">${capitalize(lead.status || 'new')}</span></td>
        `;
        tr.addEventListener('click', () => toggleDetail(lead.id));
        tbody.appendChild(tr);

        const detailTr = document.createElement('tr');
        detailTr.classList.add('detail-panel');
        detailTr.id = `detail-${lead.id}`;
        detailTr.innerHTML = `
          <td colspan="8">
            <div class="detail-inner">
              <div class="detail-group">
                <label>Planner Contact</label>
                <p>${lead.planner_name || '—'}</p>
                <p style="font-size:12px;color:#6b7280;">${lead.planner_email || ''}</p>
                <p style="font-size:12px;color:#6b7280;">${lead.planner_phone || ''}</p>
              </div>
              <div class="detail-group">
                <label>Insurance</label>
                <p>${formatInsurance(lead.insurance)}</p>
                <label style="margin-top:10px;">ZIP Code</label>
                <p>${lead.patient_zip || '—'}</p>
              </div>
              <div class="detail-group">
                <label>Notes</label>
                <p style="font-size:13px;line-height:1.5;">${lead.notes || '—'}</p>
              </div>
              <div class="detail-actions">
                <label style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#6b7280;display:block;margin-bottom:4px;">Update Status</label>
                <select class="status-select" onchange="updateStatus('${lead.id}', this.value)">
                  <option value="new" ${lead.status==='new'?'selected':''}>New</option>
                  <option value="contacted" ${lead.status==='contacted'?'selected':''}>Contacted</option>
                  <option value="matched" ${lead.status==='matched'?'selected':''}>Matched</option>
                  <option value="closed" ${lead.status==='closed'?'selected':''}>Closed</option>
                </select>
                <button class="btn-sm" style="margin-top:6px;" onclick="emailPlanner('${lead.planner_email}')">Email Planner</button>
                <button class="btn-sm btn-del" style="margin-top:4px;" onclick="deleteLead('${lead.id}')">Delete</button>
              </div>
            </div>
          </td>
        `;
        tbody.appendChild(detailTr);
      });

      renderPagination(total, pages);
    }

    function toggleDetail(id) {
      const detailRow = document.getElementById(`detail-${id}`);
      if (!detailRow) return;
      const isOpen = detailRow.classList.contains('open');
      document.querySelectorAll('.detail-panel.open').forEach(r => r.classList.remove('open'));
      if (!isOpen) detailRow.classList.add('open');
    }

    function renderPagination(total, pages) {
      document.getElementById('pageInfo').textContent =
        total ? `Showing ${Math.min((currentPage-1)*PER_PAGE+1, total)}–${Math.min(currentPage*PER_PAGE, total)} of ${total}` : '';
      const btns = document.getElementById('pageBtns');
      btns.innerHTML = '';
      if (pages <= 1) return;
      for (let i = 1; i <= pages; i++) {
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
        btn.textContent = i;
        btn.onclick = () => { currentPage = i; renderTable(); };
        btns.appendChild(btn);
      }
    }

    async function updateStatus(id, status) {
      const lead = leads.find(l => l.id === id);
      if (!lead) return;
      lead.status = status;
      try {
        await fetch(`/api/admin/discharge-referrals/${id}/status`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
      } catch(e) {}
      renderStats();
      renderTable();
    }

    function emailPlanner(email) {
      if (email) window.location.href = `mailto:${email}`;
    }

    async function deleteLead(id) {
      if (!confirm('Delete this referral? This cannot be undone.')) return;
      try {
        const res = await fetch(`/api/admin/discharge-referrals/${encodeURIComponent(id)}`, { method: 'DELETE' });
        if (!res.ok) { alert('Delete failed.'); return; }
        leads = leads.filter(l => l.id !== id);
        renderStats();
        renderTable();
      } catch(e) {
        alert('Delete failed.');
      }
    }

    function exportCSV() {
      const filtered = getFiltered();
      const headers = ['Date','Patient','Planner','Facility','ZIP','Care Type','Urgency','Insurance','Status','Notes'];
      const rows = filtered.map(l => [
        l.submitted_at ? new Date(l.submitted_at).toLocaleDateString() : '',
        `${l.patient_last || ''}, ${l.patient_first || ''}`,
        l.planner_name || '',
        l.facility || '',
        l.patient_zip || '',
        formatCareType(l.care_type),
        formatUrgency(l.urgency),
        formatInsurance(l.insurance),
        capitalize(l.status || ''),
        `"${(l.notes||'').replace(/"/g,'""')}"`
      ]);
      const csv = [headers, ...rows].map(r => r.join(',')).join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = `discharge-referrals-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    }

    function formatCareType(t) {
      return { hospice: 'Hospice', home_health: 'Home Health', palliative: 'Palliative', unsure: 'Unsure' }[t] || t || '—';
    }
    function formatUrgency(u) {
      return { immediate: 'Immediate', within_week: 'This Week', planning_ahead: 'Planning Ahead' }[u] || u || '—';
    }
    function formatInsurance(i) {
      return { medicare: 'Medicare', medicaid: 'Medicaid/AHCCCS', altcs: 'ALTCS', private_insurance: 'Private Insurance', private_pay: 'Private Pay', unknown: 'Unknown' }[i] || i || '—';
    }
    function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

    document.getElementById('admin-logout-btn').addEventListener('click', async () => {
      await window.adminAuth.logout();
      window.location.href = 'admin.html';
    });

    loadLeads();
  </script>
</body>
</html>
